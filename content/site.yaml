# 배포 후 실제 주소로 바꿔주세요 (sitemap, 공유 미리보기에 사용)
base_url: https://jiudesign.pages.dev
lang: ko

hero:
  headline: 대표님과 함께 그려가는 디자인을 합니다.
  sub: 그리는 꿈은 현실이 되고, 현실은 결과로 이어집니다. 팔리는 상세페이지부터 매장 배너까지 결과로 보여드립니다.

