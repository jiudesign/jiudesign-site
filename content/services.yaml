# 제작 서비스 안내 페이지 (/services/<slug>/) — 관리자 화면 '설정 > 제작 서비스'에서도 고칠 수 있습니다.
# 검색에 잘 나오도록 name(페이지 제목)은 사람들이 실제로 검색하는 말로 적는 것이 좋습니다.
items:
- slug: detail-page
  name: 상세페이지 제작
  headline: 팔리는 상세페이지 제작
  lead: 스마트스토어·쿠팡·자사몰에 바로 올릴 수 있는 가로 860px 상세페이지를 기획부터 디자인까지 제작합니다. 제품의 강점을 구매 순서대로 풀어 문의와 반품은 줄이고, 구매 결정은 빠르게 만듭니다.
  description: 스마트스토어·쿠팡·자사몰 상세페이지 제작. 식품, 건강기능식품, 생활용품, 화장품, 가전, 패션 등 업종별 상세페이지 디자인 포트폴리오와 제작 과정을 안내합니다.
  category: detail-page
  points:
  - title: 구매 흐름에 맞춘 기획
    text: 고객이 궁금해하는 순서대로 메인 비주얼, 핵심 특징, 추천 이유, 상세 정보, 구매 전 안내를 배치합니다.
  - title: 업종별 제작 경험
    text: 식품·건강기능식품, 가구·생활용품, 화장품·의료, 가전, 패션까지 다양한 업종의 상세페이지를 작업했습니다.
  - title: 대표님과 함께 정하는 톤앤매너
    text: 브랜드 컬러와 기존 쇼핑몰 분위기에 맞춰 디자인 방향을 함께 정하고 진행합니다.
  process:
  - 상담 및 자료 전달
  - 기획 구성안
  - 디자인 시안
  - 수정
  - 완성 파일 전달
  faq:
  - q: 상세페이지 제작 비용은 얼마인가요?
    a: 제품 수, 페이지 길이, 카피 작성 포함 여부에 따라 달라집니다. 전화로 제품과 일정을 알려주시면 견적을 안내해 드립니다.
  - q: 어떤 쇼핑몰에 올릴 수 있나요?
    a: 스마트스토어, 쿠팡, 자사몰 등 가로 860px 상세페이지를 쓰는 곳에 바로 올릴 수 있는 이미지로 드립니다.
  - q: 제품 사진이 충분하지 않아도 되나요?
    a: 가지고 계신 사진과 자료로 먼저 구성안을 잡고, 부족한 부분은 상담 때 방법을 함께 정합니다.
  - q: 수정은 어떻게 진행되나요?
    a: 작업 범위에 맞춰 수정 횟수를 정하고 견적과 함께 안내해 드립니다.

- slug: delivery-banner
  name: 배달앱 배너 제작
  headline: 주문으로 이어지는 배달앱 배너 제작
  lead: 배달의민족·쿠팡이츠·요기요 가게 배너, 이벤트·리뷰 이벤트 배너, 메뉴 이미지를 제작합니다. 가게의 대표 메뉴와 혜택이 한눈에 보이도록 정리합니다.
  description: 배달의민족·쿠팡이츠·요기요 배달앱 배너 제작. 가게 대표 배너, 이벤트 배너, 리뷰 이벤트 배너, 메뉴 이미지 디자인 포트폴리오와 제작 과정을 안내합니다.
  category: delivery-app
  points:
  - title: 앱별 규격 대응
    text: 각 배달앱에서 요구하는 크기와 형식에 맞춰 파일을 드립니다.
  - title: 프랜차이즈·개인 매장 작업 경험
    text: 프랜차이즈 본사 이벤트 배너부터 개인 매장 리뷰 이벤트 배너까지 작업했습니다.
  - title: 한눈에 읽히는 이벤트 구성
    text: 혜택, 참여 방법, 기간이 짧은 시간 안에 읽히도록 정리합니다.
  process:
  - 상담
  - 레퍼런스·자료 전달
  - 디자인 시안
  - 수정
  - 앱 규격별 파일 전달
  faq:
  - q: 배달앱 배너 제작 비용은 얼마인가요?
    a: 배너 종류와 수량에 따라 달라집니다. 필요한 배너를 알려주시면 견적을 안내해 드립니다.
  - q: 어떤 배달앱에 쓸 수 있나요?
    a: 배달의민족, 쿠팡이츠, 요기요 등 사용하시는 앱의 규격에 맞춰 드립니다.
  - q: 원하는 스타일의 레퍼런스가 있으면 반영되나요?
    a: 가지고 계신 레퍼런스를 바탕으로 원하시는 방향에 맞춰 작업합니다.
