tone: 오렌지와 크림 컬러에 네이비 포인트를 더하고, 손글씨·노트·테이프 요소로 표현한 친근하고 레트로한 톤앤매너
summary: 1인 고객을 위한 브랜드 ‘나홀로’의 배달앱 리뷰 이벤트 배너입니다. 리뷰를 ‘미식일지’로 풀어내고, 줄노트와 모눈종이, 테이프, 손글씨 그래픽을 조합해 스크랩북 같은 화면을 구성했습니다. 음식과 토핑 사진으로 서비스 혜택을 보여주고, 참여 방법을 번호 순서로 정리해 정보의 흐름을 명확하게 설계했습니다. 오렌지와 네이비의 대비로 주요 문구와 쿠폰 혜택을 강조하고, 모바일 화면에서도 읽기 쉽도록 정보의 크기와 간격을 조절했습니다.
