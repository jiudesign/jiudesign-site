tone: 피치와 오렌지, 크림 컬러에 종이 질감·손글씨·스크랩 요소를 더한 따뜻하고 친근한 분위기
summary: 한 끼 식사를 기록하는 미식일지 콘셉트로 브랜드 소개 이미지와 리뷰 이벤트 3단 배너를 함께 구성했습니다. 브랜드 소개에는 한상차림 사진과 찢어진 종이, 테이프, 손그림을 조합해 일상의 식사 기록처럼 표현했습니다. 이벤트 배너에는 노트와 모눈종이 그래픽을 이어 사용하고, 서비스 토핑과 참여 방법을 구분해 안내했습니다. 두 개의 모바일 화면 목업을 나란히 배치해 브랜드 감성과 프로모션 정보가 연결되는 모습을 보여줍니다.
